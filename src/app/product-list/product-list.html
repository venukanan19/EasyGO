<section class="products-section">

  <h2>Our Products</h2>

  <div class="product-grid">

    @for (product of products; track product.id) {

      <app-product-card
        [productName]="product.name"
        [price]="product.price"
        [imageUrl]="product.imageUrl"
        (addToCart)="handleAddToCart($event)">
      </app-product-card>

    }

  </div>

</section>
