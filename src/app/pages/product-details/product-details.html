@if (product) {

  <section class="px-6 py-10 max-w-4xl mx-auto">

    <img
      [src]="product.imageUrl"
      [alt]="product.name"
      class="w-64 mx-auto">

    <h2 class="text-3xl font-semibold mt-6">
      {{ product.name }}
    </h2>

    <p class="text-gray-500 mt-3">
      {{ product.description }}
    </p>

    <p class="mt-4 font-semibold">
      ${{ product.price }}
    </p>

    <p class="mt-2">
      {{ product.inStock ? 'In Stock' : 'Out of Stock' }}
    </p>

  </section>

} @else {

  <section class="text-center py-24">
    <h2 class="text-2xl font-semibold">Product not found</h2>
  </section>

}
